name: Update QB Standings

on:
  schedule:
    # nflverse refreshes play-by-play nightly in-season, so run every
    # morning Sep-Feb at 11:23 UTC (7:23 AM EDT / 6:23 AM EST). The odd
    # minute avoids GitHub's top-of-hour backlog. Commits only on change.
    - cron: '23 11 * 9-12,1,2 *'
  workflow_dispatch: # "Run workflow" button for manual updates

permissions:
  contents: write

concurrency:
  group: update-standings
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild standings
        run: python updater.py

      - name: Commit if standings changed
        run: |
          git config user.name "NFL Stat Bot"
          git config user.email "actions@users.noreply.github.com"
          git add standings.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update standings ($(date -u +%Y-%m-%d))"
          git push
