<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QB Draft Contest</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy: #002244;
    --navy-2: #0b3460;
    --turf: #2e6b3f;
    --turf-soft: #e3f0e6;
    --flag: #b3261e;
    --flag-soft: #fbe6e4;
    --paper: #f3f5f8;
    --card: #ffffff;
    --ink: #16212e;
    --muted: #5b6878;
    --line: #dde3ea;
    --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 16px/1.45 var(--body);
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid #4d8fd6; outline-offset: 2px; }

  /* ---------- Scoreboard ---------- */
  .board {
    background: var(--navy);
    color: #fff;
    padding: 28px 16px 22px;
    text-align: center;
  }
  .board h1 {
    margin: 0 0 18px;
    font: 700 1.05rem/1 var(--cond);
    letter-spacing: 0.04em;
    color: #b9c9dc;
  }
  .matchup {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    max-width: 560px;
    margin: 0 auto;
  }
  .side { display: flex; flex-direction: column; align-items: center; }
  .side .who { font: 700 1.4rem/1 var(--cond); }
  .side .pts {
    font: 800 clamp(4rem, 16vw, 6.5rem)/0.95 var(--cond);
    font-variant-numeric: tabular-nums;
  }
  .side.lead .pts { color: #9fe0ae; }
  .side .tag {
    font: 600 0.8rem/1 var(--body);
    margin-top: 6px;
    min-height: 1em;
    color: #9fe0ae;
  }
  .vs { font: 500 1rem var(--cond); color: #7f97b3; }
  .status {
    margin-top: 16px;
    font-size: 0.92rem;
    color: #b9c9dc;
  }
  .totals {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px 28px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--navy-2);
    font-size: 0.92rem;
    color: #d4deea;
  }
  .totals b { font: 700 1.15rem var(--cond); color: #fff; }

  /* ---------- Season tabs ---------- */
  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 14px 16px;
    max-width: 1100px;
    margin: 0 auto;
    scrollbar-width: none;
  }
  .tabs button {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 999px;
    padding: 7px 14px;
    font: 600 0.95rem var(--cond);
    cursor: pointer;
  }
  .tabs button[aria-selected="true"] {
    background: var(--navy);
    border-color: var(--navy);
    color: #fff;
  }

  /* ---------- Rosters ---------- */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 16px 48px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
    gap: 20px;
  }
  .team {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .team.lead { border-color: var(--turf); box-shadow: inset 0 4px 0 var(--turf); }
  .team header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 16px 18px 10px;
  }
  .team h2 { margin: 0; font: 700 1.6rem/1 var(--cond); }
  .team header .sum { font: 800 1.9rem/1 var(--cond); font-variant-numeric: tabular-nums; }
  .team header small { display: block; text-align: right; color: var(--muted); font-size: 0.8rem; }

  .qb { border-top: 1px solid var(--line); }
  .qb > button {
    all: unset;
    box-sizing: border-box;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 14px;
    align-items: center;
    padding: 11px 18px;
    cursor: pointer;
  }
  .qb > button:hover { background: #f8fafc; }
  .qb > button:focus-visible { outline: 3px solid #4d8fd6; outline-offset: -3px; }
  .qb .name { font: 700 1.15rem/1.15 var(--cond); }
  .qb .team-abbr { color: var(--muted); font: 500 0.95rem var(--cond); margin-left: 4px; }
  .qb .flags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .flag {
    font-size: 0.74rem;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 4px;
    background: var(--paper);
    color: var(--muted);
  }
  .flag.bad { background: var(--flag-soft); color: var(--flag); }
  .flag.good { background: var(--turf-soft); color: var(--turf); }
  .qb .rec { font: 500 1.05rem var(--cond); color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .qb .pts { font: 800 1.6rem/1 var(--cond); min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }
  .qb.out .name, .qb.out .pts { color: var(--muted); }

  .detail { display: none; padding: 2px 18px 16px; font-size: 0.9rem; color: var(--muted); }
  .qb.open .detail { display: block; }
  .math { margin: 0 0 10px; }
  .math b { color: var(--ink); }
  .strip { display: flex; flex-wrap: wrap; gap: 4px; }
  .g {
    width: 38px;
    border-radius: 4px;
    text-align: center;
    padding: 3px 0 2px;
    font: 600 0.72rem/1.1 var(--body);
    background: var(--paper);
    color: var(--muted);
  }
  .g span { display: block; font: 800 0.95rem/1 var(--cond); }
  .g.W { background: var(--turf-soft); color: var(--turf); }
  .g.L { background: var(--flag-soft); color: var(--flag); }
  .g.post { outline: 2px solid var(--navy); outline-offset: -2px; }
  .legend { margin-top: 8px; font-size: 0.78rem; }

  .bench {
    grid-column: 1 / -1;
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 0.92rem;
    color: var(--muted);
  }
  .bench h3 { margin: 0 0 6px; font: 700 1.15rem var(--cond); color: var(--ink); }
  .bench p { margin: 4px 0; }

  .all-row > button { grid-template-columns: 1fr auto; }

  .g.mark { box-shadow: inset 0 -3px 0 #c58a00; }

  .audit {
    grid-column: 1 / -1;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 18px 6px;
  }
  .audit h3 { margin: 0 0 2px; font: 700 1.25rem var(--cond); }
  .audit > p { margin: 0 0 10px; color: var(--muted); font-size: 0.9rem; }
  .audit ul { list-style: none; margin: 0; padding: 0; }
  .audit li {
    display: grid;
    grid-template-columns: 7.5rem 1fr;
    gap: 10px;
    padding: 9px 0;
    border-top: 1px solid var(--line);
    font-size: 0.92rem;
  }
  .audit .kind { font: 700 0.95rem var(--cond); color: var(--navy); }
  .audit .who { display: block; font: 500 0.85rem var(--body); color: var(--muted); }
  @media (max-width: 520px) { .audit li { grid-template-columns: 1fr; gap: 2px; } }

  .status a { color: #cfe0f3; }

  .rules {
    grid-column: 1 / -1;
    max-width: 68ch;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 22px 10px;
  }
  .rules h2 { margin: 0 0 10px; font: 700 1.6rem var(--cond); }
  .rules h3 { margin: 22px 0 4px; font: 700 1.25rem var(--cond); color: var(--navy); }
  .rules p { margin: 0 0 10px; }
  .rules .eg { color: var(--muted); font-size: 0.92rem; }
  .rules table { width: 100%; border-collapse: collapse; }
  .rules th, .rules td { text-align: left; padding: 8px 0; border-top: 1px solid var(--line); font-weight: 500; }
  .rules td { text-align: right; font: 700 1.05rem var(--cond); }

  .g { cursor: pointer; }
  .tip {
    position: fixed;
    z-index: 50;
    max-width: 280px;
    background: var(--ink);
    color: #fff;
    border-radius: 8px;
    padding: 9px 11px;
    font: 400 0.85rem/1.4 var(--body);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    pointer-events: none;
  }
  .tip b { font-weight: 600; }

  .h2h-seasons td { width: 6.5rem; }
  .opps, .h2h-log { list-style: none; margin: 0 0 10px; padding: 0; }
  .opps li, .h2h-log li {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 0;
    border-top: 1px solid var(--line);
  }
  .opps b, .h2h-log b { font: 700 1rem var(--cond); color: var(--ink); white-space: nowrap; }
  .h2h-log { font-size: 0.85rem; }
  .h2h-log li.W b { color: var(--turf); }
  .h2h-log li.L b { color: var(--flag); }

  .note { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 0.85rem; }
  .note a { color: inherit; }

  /* ---------- TT13's sticker (by request) ---------- */
  .tt13-special {
    position: absolute;
    top: 8px;
    left: 8px;
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", cursive;
    font-size: 11px;
    line-height: 1.3;
    color: #ff00ff;
    background: #ccff00;
    border: 3px dashed #00ffff;
    padding: 5px;
    transform: rotate(-15deg);
    box-shadow: 3px 3px 0 #ff0000;
    z-index: 10;
    animation: vibrate 0.3s linear infinite both;
  }
  @keyframes vibrate {
    0%,100% { transform: rotate(-15deg) translate(0,0); }
    20% { transform: rotate(-17deg) translate(-1px,1px); }
    40% { transform: rotate(-13deg) translate(-1px,-1px); }
    60% { transform: rotate(-17deg) translate(1px,1px); }
    80% { transform: rotate(-13deg) translate(1px,-1px); }
  }
  @media (max-width: 640px) {
    .tt13-special { position: static; display: inline-block; margin: 4px 0 26px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tt13-special { animation: none; }
  }
</style>
</head>
<body>
  <section class="board" aria-live="polite">
    <div class="tt13-special" id="sticker" hidden></div>
    <h1>TT13 vs Matt: QB Draft Contest</h1>
    <div class="matchup" id="matchup">Loading standings…</div>
    <div class="status" id="status"></div>
    <div class="totals" id="totals"></div>
  </section>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Season"></nav>
  <main id="main"></main>

<script>
let data;
const $ = (id) => document.getElementById(id);
const UPDATE_URL =
  "https://github.com/the-monkey-from-mars/qb-draft-tracker/actions/workflows/update.yml";

function load() {
  return fetch("standings.json", { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
}

load()
  .then((d) => {
    data = d;
    buildChrome();
    const years = Object.keys(d.seasons).sort();
    const fromHash = location.hash.slice(1);
    select(d.seasons[fromHash] || ["all","rules","h2h"].includes(fromHash) ? fromHash : years[years.length - 1]);
  })
  .catch((e) => {
    $("matchup").textContent = "Couldn't load standings.json. Refresh to try again.";
    console.error(e);
  });

// When someone returns to an open tab, pick up any newer standings.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !data) return;
  load().then((d) => {
    if (d.generated_at === data.generated_at) return;
    data = d;
    buildChrome();
    select(location.hash.slice(1) || Object.keys(d.seasons).sort().pop());
  }).catch(() => {});
});

function buildChrome() {
  H2H_KEYS = new Set();
  for (const g of data.head_to_head || []) {
    const [a, b] = data.managers;
    H2H_KEYS.add(`${g.date}|${g.ids[a]}|${g.ids[b]}`);
    H2H_KEYS.add(`${g.date}|${g.ids[b]}|${g.ids[a]}`);
  }
  const [a, b] = data.managers;
  const w = data.season_wins;
  const s = $("sticker");
  s.innerHTML = `OFFICIAL SEASON WINS<br>${b}: ${w[b]}<br>${a}: ${w[a]}<br>🤪🤪🤪`;
  s.hidden = false;

  const lt = data.lifetime_points;
  $("totals").innerHTML =
    `<span>Lifetime points: <b>${a} ${lt[a]}</b> to <b>${b} ${lt[b]}</b></span>` +
    `<span>Seasons won: <b>${a} ${w[a]}</b> to <b>${b} ${w[b]}</b></span>`;

  const tabs = Object.keys(data.seasons).sort().reverse().map((y) =>
    `<button role="tab" data-key="${y}">${data.seasons[y].label}</button>`);
  tabs.push(`<button role="tab" data-key="all">All-time</button>`);
  tabs.push(`<button role="tab" data-key="h2h">Head-to-head</button>`);
  tabs.push(`<button role="tab" data-key="rules">Rules</button>`);
  $("tabs").innerHTML = tabs.join("");
  $("tabs").onclick = (e) => { const k = e.target.dataset.key; if (k) select(k); };
}

window.addEventListener("hashchange", () => {
  const k = location.hash.slice(1);
  if (data && (data.seasons[k] || ["all", "rules", "h2h"].includes(k))) select(k);
});

function select(key) {
  history.replaceState(null, "", "#" + key);
  for (const b of $("tabs").children) b.setAttribute("aria-selected", b.dataset.key === key);
  key === "all" ? renderAllTime() : key === "rules" ? renderRules() : key === "h2h" ? renderH2H() : renderSeason(key);
}

function leaderOf(pts) {
  const [a, b] = data.managers;
  return pts[a] === pts[b] ? null : pts[a] > pts[b] ? a : b;
}

function renderBoard(pts, title, status, finalTag) {
  const lead = leaderOf(pts);
  $("matchup").innerHTML = data.managers.map((m, i) => `
    ${i ? '<div class="vs">vs</div>' : ""}
    <div class="side ${m === lead ? "lead" : ""}">
      <div class="who">${m}</div>
      <div class="pts">${pts[m]}</div>
      <div class="tag">${m === lead ? finalTag : ""}</div>
    </div>`).join("");
  $("status").textContent = status;
}

function renderSeason(year) {
  const s = data.seasons[year];
  const pts = Object.fromEntries(data.managers.map((m) => [m, s.managers[m].points]));
  const live = s.status !== "final";
  const updated = new Date(data.generated_at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  renderBoard(pts, s.label,
    live ? `${s.label} season, through Week ${s.through_week}. Last updated ${updated}; refreshes automatically each morning.`
         : `${s.label} season, final.${s.stakes ? " Stakes: " + s.stakes + "." : ""}`,
    live ? "Leading" : "Season winner");
  if (live) {
    $("status").insertAdjacentHTML("beforeend",
      ` <a href="${UPDATE_URL}" target="_blank" rel="noopener">Run an update now</a> (repo owner).`);
  }

  const lead = leaderOf(pts);
  let html = data.managers.map((m) => {
    const md = s.managers[m];
    const rows = [...md.roster].sort((a, b) => b.points - a.points).map(qbRow).join("");
    return `<section class="team ${m === lead ? "lead" : ""}">
      <header><h2>${m}</h2><div><div class="sum">${md.points}</div><small>points</small></div></header>
      ${rows}</section>`;
  }).join("");

  if (live && s.bench) {
    html += `<div class="bench"><h3>Benches</h3>
      ${data.managers.map((m) => `<p><b>${m}</b> can swap in: ${(s.bench[m] || []).join(", ")}</p>`).join("")}
      <p>One swap per side, locked in before Week 10. The outgoing QB keeps Weeks 1–9; the new QB scores from Week 10 on.</p></div>`;
  }
  html += auditPanel(s);
  html += `<p class="note">Tap a quarterback to see each game. Source: <a href="https://github.com/nflverse">nflverse</a> play-by-play.</p>`;
  $("main").innerHTML = html;
  wireRows();
  wireTips();
}

function qbRow(q) {
  const flags = [];
  if (q.halved) flags.push(`<span class="flag bad">Under .500, halved</span>`);
  if (q.subbed_out_after) flags.push(`<span class="flag">Benched after Wk ${q.subbed_out_after}</span>`);
  if (q.subbed_in_week) flags.push(`<span class="flag">Swapped in Wk ${q.subbed_in_week}</span>`);
  if (q.byes) flags.push(`<span class="flag good">Bye</span>`);
  if (q.playoff_wins) flags.push(`<span class="flag good">${q.playoff_wins} playoff W</span>`);
  if (q.sb_wins) flags.push(`<span class="flag good">Super Bowl</span>`);

  const rec = `${q.wins}-${q.losses}${q.ties ? "-" + q.ties : ""}`;
  const post = [];
  if (q.byes) post.push(`bye ${3 * q.byes}`);
  if (q.playoff_wins) post.push(`playoff wins ${3 * q.playoff_wins}`);
  if (q.sb_wins) post.push(`Super Bowl ${5 * q.sb_wins}`);

  const math = `<p class="math"><b>${q.wins}</b> regular-season win${q.wins === 1 ? "" : "s"}` +
    (q.ties ? ` and <b>${q.ties}</b> tie${q.ties === 1 ? "" : "s"} at ½ point` : "") +
    (q.halved ? `, halved and rounded down to <b>${q.reg_points}</b>` : "") +
    (post.length ? `, plus ${post.join(", ")}` : "") + ` = <b>${q.points}</b>.` +
    (q.goff_rule ? ` Goff rule took ${q.goff_rule} game${q.goff_rule > 1 ? "s" : ""} away.` : "") +
    (q.missed_games ? ` Missed ${q.missed_games}.` : "") + `</p>`;

  const games = q.games.map((g) => {
    const cls = g.res === "W" || g.res === "L" ? g.res : "";
    const label = { goff: "G", DNP: "–", pending: "…", T: "T" }[g.res] || g.res;
    const wk = g.type === "REG" ? g.wk : g.type === "SB" ? "SB" : g.type;
    const mark = g.ruling || g.tiebreak ? "mark" : "";
    return `<span class="g ${cls} ${mark} ${g.type !== "REG" ? "post" : ""}" tabindex="0"
      data-tip="${esc(gameTip(q, g))}">${wk}<span>${label}</span></span>`;
  }).join("");

  return `<div class="qb ${q.subbed_out_after ? "out" : ""}">
    <button aria-expanded="false">
      <div><span class="name">${q.name}</span><span class="team-abbr">${q.team || ""}</span>
        ${flags.length ? `<div class="flags">${flags.join("")}</div>` : ""}</div>
      <div class="rec">${rec}</div>
      <div class="pts">${q.points}</div>
    </button>
    <div class="detail">${math}<div class="strip">${games}</div>
      <div class="legend">G = Goff rule (another QB threw more), – = did not play, gold underline = attempts tie or commissioner ruling, outlined = playoffs. Details under Scoring notes.</div></div>
  </div>`;
}

const ROUND = { WC: "Wild Card round", DIV: "Divisional round", CON: "Conference championship", SB: "Super Bowl" };
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
const last = (n) => (n || "").split(" ").slice(-1)[0];
let H2H_KEYS = new Set(); // "date|id|id" for games that were TT13 vs Matt

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}

function gameTip(q, g) {
  const when = (g.type === "REG" ? `Week ${g.wk}` : ROUND[g.type]) + (g.date ? `, ${fmtDate(g.date)}` : "");
  let line = "";
  if (g.score) {
    const [us, them] = g.score.split("-").map(Number);
    line = g.home ? `${g.opp} ${them} at ${g.team} ${us}` : `${g.team} ${us} at ${g.opp} ${them}`;
  }
  const outcome = { W: "Win", L: "Loss", T: "Tie (½ point)" };
  let rows = [`<b>${when}</b>`];
  if (line) rows.push(line);
  if (g.res === "pending") rows.push("Waiting on play-by-play data.");
  else if (g.res === "DNP") rows.push(`${last(q.name)} didn't play.`);
  else if (g.res === "goff") {
    rows.push(`${outcome[g.outcome]} credited to ${g.credited} (${g.credited_att} att). ${last(q.name)} threw ${g.att}, so it doesn't count for him.`);
  } else {
    rows.push(`<b>${outcome[g.res]}</b> for ${last(q.name)} (${g.att} att)`);
    if (g.opp_qb) {
      const vs = H2H_KEYS.has(`${g.date}|${q.id}|${g.opp_qb_id}`) ? " (TT13 vs Matt matchup)" : "";
      rows.push(`Opposing QB: ${g.opp_qb} (${g.opp_att} att)${vs}`);
    }
  }
  if (g.tiebreak) rows.push(`Tied attempts with ${g.tiebreak}; the starter gets the result.`);
  if (g.ruling) rows.push(`Ruling: ${g.ruling}`);
  if (g.bye) rows.push("Also credited with the first-round bye (+3).");
  return rows.join("<br>");
}

// One floating card for every game square: hover or keyboard focus shows it,
// tap toggles it on touch screens.
function wireTips() {
  let tip = $("tip");
  if (!tip) {
    tip = document.createElement("div");
    tip.id = "tip"; tip.className = "tip"; tip.setAttribute("role", "tooltip"); tip.hidden = true;
    document.body.appendChild(tip);
    const show = (el) => {
      tip.innerHTML = el.dataset.tip; tip.hidden = false;
      const r = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
      let x = r.left + r.width / 2 - t.width / 2, y = r.top - t.height - 8;
      if (y < 8) y = r.bottom + 8;
      x = Math.max(8, Math.min(x, window.innerWidth - t.width - 8));
      tip.style.left = x + "px"; tip.style.top = y + "px";
      tip.dataset.for = el.dataset.tip;
      tip.dataset.at = Date.now();
    };
    const hide = () => { tip.hidden = true; tip.dataset.for = ""; };
    // Touch screens fire fake hover events around a tap; ignore those so a
    // tap opens the card and a tap elsewhere closes it.
    let touchedAt = 0;
    document.addEventListener("touchstart", () => { touchedAt = Date.now(); }, { passive: true, capture: true });
    const touching = () => Date.now() - touchedAt < 1500;
    document.addEventListener("mouseover", (e) => { const el = e.target.closest("[data-tip]"); if (el && !touching()) show(el); });
    document.addEventListener("mouseout", (e) => { if (e.target.closest("[data-tip]") && !touching()) hide(); });
    document.addEventListener("focusin", (e) => { const el = e.target.closest("[data-tip]"); if (el) show(el); });
    document.addEventListener("focusout", hide);
    document.addEventListener("click", (e) => {
      const el = e.target.closest("[data-tip]");
      if (!el) return hide();
      show(el);
    }, true);
    // Ignore the scroll a tap causes when it focuses a square near the edge.
    window.addEventListener("scroll", () => { if (Date.now() - (+tip.dataset.at || 0) > 500) hide(); }, { passive: true });
  }
}

const AUDIT_LABELS = {
  swap: "Bench swap",
  goff: "Goff rule",
  tiebreak: "Attempts tied",
  tie: "NFL tie",
  ruling: "Ruling",
};

function auditPanel(s) {
  const items = s.audit || [];
  const order = Object.keys(AUDIT_LABELS);
  const sorted = [...items].sort((a, b) => order.indexOf(a.kind) - order.indexOf(b.kind));
  const list = sorted.map((a) => `<li>
      <span class="kind">${AUDIT_LABELS[a.kind] || a.kind}<span class="who">${a.manager}</span></span>
      <span>${a.text}</span></li>`).join("");
  return `<section class="audit">
    <h3>Scoring notes</h3>
    <p>${items.length
      ? "Every result that didn't simply go to the starting QB, plus bench swaps and ties."
      : "Nothing unusual yet: every result went to the starting QB."}</p>
    <ul>${list}</ul></section>`;
}

function wireRows() {
  for (const btn of document.querySelectorAll(".qb > button")) {
    btn.onclick = () => {
      const open = btn.parentElement.classList.toggle("open");
      btn.setAttribute("aria-expanded", open);
    };
  }
}

function recStr(r) { return `${r.w}-${r.l}${r.t ? "-" + r.t : ""}`; }

function renderH2H() {
  const games = data.head_to_head || [];
  const [a, b] = data.managers;
  const wins = { [a]: 0, [b]: 0 }, post = { [a]: 0, [b]: 0 };
  let ties = 0;
  for (const g of games) {
    if (!g.winner) { ties++; continue; }
    wins[g.winner]++;
    if (g.type !== "REG") post[g.winner]++;
  }
  const seasons = [...new Set(games.map((g) => g.season))];
  renderBoard(wins, "Head-to-head",
    `${games.length} games where a TT13 QB faced a Matt QB, ${seasons[0]}–${seasons[seasons.length - 1]}` +
    `${ties ? `, ${ties} tied` : ""}. Playoffs: ${a} ${post[a]}, ${b} ${post[b]}.`, "Leads head-to-head");

  // Season-by-season split
  const bySeason = seasons.map((y) => {
    const gs = games.filter((g) => g.season === y);
    const w = (m) => gs.filter((g) => g.winner === m).length;
    return `<tr><th>${data.seasons[y].label}</th><td>${w(a)}</td><td>${w(b)}</td><td>${gs.filter((g) => !g.winner).length || ""}</td><td>${gs.length}</td></tr>`;
  }).join("");
  let html = `<section class="rules h2h-seasons"><h2>By season</h2>
    <table><tr><th></th><td>${a} wins</td><td>${b} wins</td><td>Ties</td><td>Games</td></tr>${bySeason}</table>
    <p class="eg">A game counts when both QBs were on their manager's roster that week and were credited with the result under the Goff rule. Playoff games are included.</p></section>`;

  // Each QB's record while on a given manager's roster
  html += data.managers.map((m) => {
    const other = m === a ? b : a;
    const stints = {};
    for (const g of games) {
      const id = g.ids[m];
      const st = (stints[id] ??= { name: g.qbs[m], seasons: new Set(), w: 0, l: 0, t: 0, opps: {}, games: [] });
      const res = !g.winner ? "T" : g.winner === m ? "W" : "L";
      st[res.toLowerCase()]++;
      st.seasons.add(g.season);
      const o = (st.opps[g.ids[other]] ??= { name: g.qbs[other], w: 0, l: 0, t: 0 });
      o[res.toLowerCase()]++;
      st.games.push({ ...g, res });
    }
    const rows = Object.values(stints).sort((x, y) => (y.w + y.l + y.t) - (x.w + x.l + x.t) || y.w - x.w).map((st) => {
      const yrs = [...st.seasons].map((y) => data.seasons[y].label);
      const opps = Object.values(st.opps).sort((x, y) => (y.w + y.l + y.t) - (x.w + x.l + x.t))
        .map((o) => `<li><span>vs ${o.name}</span><b>${recStr(o)}</b></li>`).join("");
      const log = st.games.map((g) => {
        const where = g.home === m ? `${g.teams[other]} ${g.score[other]} at ${g.teams[m]} ${g.score[m]}`
                                   : `${g.teams[m]} ${g.score[m]} at ${g.teams[other]} ${g.score[other]}`;
        const when = g.type === "REG" ? `Wk ${g.wk}` : ROUND[g.type];
        return `<li class="${g.res}"><span>${fmtDate(g.date)}, ${when}: ${where}, vs ${g.qbs[other]}</span><b>${g.res}</b></li>`;
      }).join("");
      return `<div class="qb"><button aria-expanded="false">
          <div><span class="name">${st.name}</span>
            <div class="flags"><span class="flag">${yrs.length > 2 ? yrs[0] + " to " + yrs[yrs.length - 1] : yrs.join(", ")}</span></div></div>
          <div class="rec">${st.w + st.l + st.t} games</div>
          <div class="pts">${recStr(st)}</div></button>
        <div class="detail"><ul class="opps">${opps}</ul><ul class="h2h-log">${log}</ul></div></div>`;
    }).join("");
    return `<section class="team ${wins[m] > wins[other] ? "lead" : ""}">
      <header><h2>${m}'s QBs</h2><div><div class="sum">${recStr({ w: wins[m], l: wins[other], t: ties })}</div><small>vs ${other}</small></div></header>
      ${rows}</section>`;
  }).join("");
  html += `<p class="note">A QB who played for both managers appears once under each, with only the games from that stint.</p>`;
  $("main").innerHTML = html;
  wireRows();
}

function renderRules() {
  const lt = data.lifetime_points;
  renderBoard(lt, "All-time", "Lifetime points across every draft.", "All-time leader");
  $("main").innerHTML = `<section class="rules">
    <h2>Scoring</h2>
    <table>
      <tr><th>Regular-season win</th><td>1 point</td></tr>
      <tr><th>Regular-season tie</th><td>½ point (half a win)</td></tr>
      <tr><th>Playoff win (not the Super Bowl)</th><td>3 points</td></tr>
      <tr><th>First-round bye</th><td>3 points (counts as a playoff win)</td></tr>
      <tr><th>Super Bowl win</th><td>5 points</td></tr>
    </table>

    <h3>Under .500</h3>
    <p>If a QB finishes the regular season below .500, his regular-season points are halved and rounded down to the nearest whole number. Ties count as half a win, both for the .500 check and for the points being halved. Playoff, bye and Super Bowl points are never halved.</p>
    <p class="eg">Example: 3 wins, 1 tie, 5 losses is a .389 record. Regular-season points are 3.5, halved to 1.75, rounded down to 1.</p>

    <h3>Goff rule</h3>
    <p>Every game's result goes to the quarterback on that team who threw the most pass attempts, whatever the reason: injury, rest or benching. If two QBs threw the same number, the starter gets the result. Sacks and two-point tries don't count as attempts.</p>
    <p class="eg">Example: Burrow left 2025 Week 2 hurt after 13 passes and Browning threw 32 in the win, so the win went to Browning, not Burrow.</p>

    <h3>Bench (since 2024–25)</h3>
    <p>After the main draft, each manager picks five undrafted starting QBs to form the other manager's bench. Starting in Week 9, each manager may swap one starter for one bench QB, once, locked in before Week 10. The outgoing QB scores Weeks 1–9; the incoming QB scores Week 10 onward, playoffs included. Each is scored separately, so the under-.500 rule applies to each half on its own. A new bench is drafted every year, and a QB swapped into the lineup stays on that roster the following year.</p>

    <h3>Winning the season</h3>
    <p>Most points wins the season. The loser buys the winner an NFL jersey of the winner's choice. The manager whose QB wins the Super Bowl picks first in the next draft; otherwise the higher scorer picks first.</p>

    <p class="eg">Every swap, Goff-rule game, tied-attempts game and NFL tie is listed under "Scoring notes" on each season's page.</p>
  </section>`;
}

function renderAllTime() {
  const lt = data.lifetime_points;
  renderBoard(lt, "All-time", `All seasons combined, ${Object.keys(data.seasons).length} drafts.`, "All-time leader");
  const lead = leaderOf(lt);

  $("main").innerHTML = data.managers.map((m) => {
    const agg = {};
    for (const [y, s] of Object.entries(data.seasons)) {
      for (const q of s.managers[m].roster) {
        const a = (agg[q.id] ??= { name: q.name, w: 0, l: 0, t: 0, po: 0, byes: 0, sb: 0, pts: 0, years: [] });
        a.w += q.wins; a.l += q.losses; a.t += q.ties;
        a.po += q.playoff_wins; a.byes += q.byes; a.sb += q.sb_wins; a.pts += q.points;
        if (!a.years.includes(y)) a.years.push(y);
      }
    }
    const rows = Object.values(agg).sort((a, b) => b.pts - a.pts).map((a) => `
      <div class="qb all-row"><button tabindex="-1" style="cursor:default">
        <div><span class="name">${a.name}</span>
          <div class="flags"><span class="flag">${a.years.length} season${a.years.length > 1 ? "s" : ""}</span>
          <span class="flag">${a.w}-${a.l}${a.t ? "-" + a.t : ""} reg.</span>
          ${a.po + a.byes ? `<span class="flag good">${a.po} playoff W, ${a.byes} bye</span>` : ""}
          ${a.sb ? `<span class="flag good">${a.sb} Super Bowl</span>` : ""}</div></div>
        <div class="pts">${a.pts}</div></button></div>`).join("");
    return `<section class="team ${m === lead ? "lead" : ""}">
      <header><h2>${m}</h2><div><div class="sum">${lt[m]}</div><small>lifetime</small></div></header>${rows}</section>`;
  }).join("");
}
